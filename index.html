<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI - Mídia Social</title>
    <!-- Arquivo de estilo visual do site -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Barra de navegacao no topo da pagina -->
<header>

    <!-- Espaco da foto da logo -->
    <div class="logo">
        <img src="insiraaqui" alt="Logo">
    </div>

    <!-- Botoes do menu principal -->
    <div class="botoesIniciais">

        <a href="paginaInicial.html">
            <button id="botao-paginicial">Página Inicial</button>
        </a>

        <button id="botao-Mensagens">Mensagem</button>

        <button id="botao-publicacoes">Publicações</button>

        <a href="paginaPerfil.html">
            <button id="botao-meuperfil">Meu Perfil</button>
        </a>

        <a href="configuracoes-seguranca.html">
            <button id="botao-configuracoes">Configurações</button>
        </a>

        <!-- Botao que abre a janela de criar post -->
        <button id="botao-publicar">Publicar</button>

    </div>

    <!-- Foto de perfil pequenininha do topo -->
    <button class="profilepicture1">N</button>

</header>


<!-- Corpo principal do site -->
<main class="conteudoPrincipal">

    <!-- Caixa do perfil no lado esquerdo -->
    <aside class="perfil">

        <div class="quadradoperfil">

            <!-- Foto, nome e usuario -->
            <div class="perfilTopo">

                <div class="perfilfotoP">
                    N
                </div>

                <div class="dadosPerfil">
                    <h1>Nome de Perfil</h1>
                    <p>@nomedeusuario</p>
                </div>

            </div>

            <!-- Bio e curso do usuario -->
            <div class="informacoesPerfil">
                <h3>Curso q fezzz</h3>
                <p>Insira sua biografia</p>
            </div>

            <!-- Numero de seguidores e seguindo -->
            <div class="seguidores">
                <span>67 seguidores</span>
                <span>/</span>
                <span>67 seguindo</span>
            </div>

        </div>

    </aside>


    <!-- Area do meio com o feed e as informacoes -->
    <section class="areaCentral">

        <!-- Card que mostra a barra do curso -->
        <div class="curso">

            <h2>Cursos atuais</h2>

            <p>Técnico em desenv. de sistemas</p>

            <strong>
                <span id="porcentagem">60</span>% concluído
            </strong>

            <!-- Barra cinza com a parte colorida dentro -->
            <div class="barra">
                <div class="progresso" id="progresso"></div>
            </div>

        </div>


        <!-- Area onde ficam todas as postagens -->
        <div class="publicacoes" id="publicacoes">

            <!-- Um post do feed -->
            <article class="publicacao">

                <!-- Quem postou -->
                <div class="cabecalhoPublicacao">

                    <div class="fotoPublicacao">
                        N
                    </div>

                    <div class="nomePublicacao">
                        <strong>Nome de Perfil</strong>
                        <span>@nomedeusuario</span>
                    </div>

                </div>

                <!-- Texto do post -->
                <p class="textoPublicacao">
                    moranguete abacatudo six seven quatu dois
                </p>

                <!-- Foto ou previa do post -->
                <div class="imagemPublicacao">
                    <span>Prévia da publicação</span>
                </div>

                <!-- Botao de curtir e contagem -->
                <div class="acoes">
                    <button class="botaoLike">♡</button>
                    <span class="numeroLikes">67 likes</span>
                </div>

                <!-- Parte dos comentarios -->
                <div class="comentarios">

                    <!-- Onde os comentarios digitados vao aparecer -->
                    <div class="listaComentarios"></div>

                    <!-- Campo para digitar um novo comentario -->
                    <form class="formComentario">
                        <input
                            type="text"
                            class="inputComentario"
                            placeholder="Escreva um comentário..."
                            maxlength="150"
                            required>

                        <button type="submit">Enviar</button>
                    </form>

                </div>

            </article>

        </div>

    </section>


    <!-- Elemento para enfeite ou ajuste de layout -->
    <div class="forma"></div>

</main>


<!-- Janela popup que abre quando clica no botao "Publicar" -->
<div class="modal" id="modalPublicacao">

    <div class="caixaModal">

        <!-- Botao X de fechar a janela -->
        <button class="fecharModal" id="fecharModal">×</button>

        <h2>Nova publicação</h2>

        <!-- Espaco para escrever o post -->
        <textarea
            id="textoNovaPublicacao"
            placeholder="O que você quer compartilhar?"
            maxlength="500">
        </textarea>

        <!-- Botao para enviar foto ou video -->
        <label class="botaoArquivo">
            Escolher foto ou vídeo
            <input
                type="file"
                id="arquivoPublicacao"
                accept="image/*,video/*">
        </label>

        <!-- Mostra a foto antes de postar -->
        <div id="previewArquivo"></div>

        <!-- Botao final de publicar -->
        <button class="enviarPublicacao" id="enviarPublicacao">
            Publicar
        </button>

    </div>

</div>

<!-- Ligacao com o script JavaScript -->
<script src="script.js"></script>

</body>
</html>
